name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 构建产物不得包含 key 痕迹
        run: |
          matches=$(grep -rli --binary-files=without-match "sk-\|DASHSCOPE_API_KEY\|IMAGE_API_KEY" dist/ || true)
          if [ -n "$matches" ]; then
            echo "发现疑似 key 泄露："
            grep -rin --binary-files=without-match "sk-\|DASHSCOPE_API_KEY\|IMAGE_API_KEY" $matches | head -5
            exit 1
          fi
      - run: npm test
